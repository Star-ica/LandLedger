<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace – LandLedger</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="nav"><a class="logo" href="index.html"><i>🏠</i><span>LandLedger</span></a><div class="links"><a href="index.html" class="">Home</a><a href="browse.html" class="on">Marketplace</a><a href="dashboard.html" class="">My properties</a><a href="admin.html" class="">Registrar</a></div><button class="btn" id="wbtn">Connect wallet</button></nav>
<main class="wrap"><h1>Marketplace</h1><p class="sub">Properties currently for sale. No wallet needed to browse.</p><input class="search" id="q" placeholder="Search by title or location…"><div class="grid" id="grid"><p class="empty">Loading…</p></div></main>
<footer>© 2026 LandLedger · Built on BOT Chain<br><a href="https://botchain.ai" target="_blank" rel="noopener">BOT Chain Website</a> · <a href="https://scan.bohr.life" target="_blank" rel="noopener">BOT Chain Explorer</a></footer><div id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script src="js/app.js"></script>
<script>
let items=[];
function draw(){
  const q=$("#q").value.toLowerCase();
  const f=items.filter(x=>(x.t+x.l).toLowerCase().includes(q));
  $("#grid").innerHTML=f.map(x=>`<a class="card prop" href="property.html?id=${x.id}"><div class="pic">🏡</div><h3 style="margin:4px 0 0">${esc(x.t)}</h3><p>📍 ${esc(x.l)||"—"} · ${esc(x.s)||"—"}</p><div class="price">${bot(x.price)}</div>${x.pending?'<span class="badge off">Offer pending</span>':'<span class="badge ok">Available</span>'}</a>`).join("")||'<p class="empty" style="grid-column:1/-1">No properties match.</p>';
}
(async()=>{
  if(!ro){$("#grid").innerHTML='<div class="notice" style="grid-column:1/-1">Set CONTRACT_ADDRESS in js/app.js</div>';return}
  try{for(const id of await ro.listings()){const [t,l,s]=await ro.getProperty(id),sale=await ro.getSale(id);items.push({id,t,l,s,price:sale[1],pending:sale[3]!==ethers.ZeroAddress})}draw()}
  catch(e){$("#grid").innerHTML='<p class="empty" style="grid-column:1/-1">Could not load listings.</p>'}
})();
$("#q").oninput=draw;
</script></body></html>
